[mypy]
python_version = 3.12

# 严格一点：连"没写注解的函数体"也检查
check_untyped_defs = True
# 不允许 None 隐式当成 Optional
no_implicit_optional = True
# 报错时带上错误码（方便上网搜）
show_error_codes = True
show_column_numbers = True
pretty = True
# 用到的配置必须真的生效（防止配置写错没效果）
warn_unused_ignores = True
warn_redundant_casts = True

# 第三方库（qwen_agent / sympy / dotenv 等）没有类型存根，别报它们的错
ignore_missing_imports = True
follow_imports = silent

# 我们自己的代码要查
[mypy-miniagent.*]
ignore_errors = False

# examples / tests 里会故意写"错的"来演示，不用太严
[mypy-miniagent.examples.*]
ignore_errors = True

[mypy-miniagent.tests.*]
ignore_errors = True

[mypy-miniagent.p02.*]
ignore_errors = True

[mypy-miniagent.p03.*]
ignore_errors = True
